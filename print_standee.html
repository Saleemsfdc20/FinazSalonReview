<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finaaz Salon - Review QR Standee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

  :root {
    --brand: #be185d;
    --brand-dark: #831843;
    --gold: #d97706;
    --bg: #fff1f2;
    --ink: #0f172a;
    --muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--ink);
  }

  .print-bar {
    margin-bottom: 20px;
    display: flex;
    gap: 12px;
  }

  .btn {
    background: var(--brand);
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(190, 24, 93, 0.4);
    transition: transform 0.15s ease;
  }
  .btn:hover { transform: scale(1.03); }

  /* Standee Card (A5 / Table Tent ratio) */
  .standee {
    width: 380px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 25px 60px rgba(15, 23, 42, 0.18);
    overflow: hidden;
    text-align: center;
    border: 2px solid #fce7f3;
    position: relative;
  }

  .header {
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: white;
    padding: 34px 24px 28px;
    position: relative;
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: -16px;
    left: 0;
    right: 0;
    height: 32px;
    background: #ffffff;
    border-radius: 24px 24px 0 0;
  }

  .logo-badge {
    width: 64px;
    height: 64px;
    background: rgba(255, 255, 255, 0.22);
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    margin: 0 auto 12px;
    display: grid;
    place-items: center;
    font-size: 30px;
    font-weight: 800;
    backdrop-filter: blur(6px);
  }

  .header h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.25;
  }
  .header p {
    font-size: 12.5px;
    opacity: 0.92;
    margin-top: 5px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .body {
    padding: 14px 28px 30px;
  }

  .callout {
    font-size: 19px;
    font-weight: 800;
    color: var(--brand-dark);
    margin-bottom: 4px;
  }
  .stars {
    color: #fbbf24;
    font-size: 24px;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .qr-box {
    background: #fff5f7;
    border: 2.5px dashed var(--brand);
    border-radius: 22px;
    padding: 16px;
    display: inline-block;
    margin: 4px auto 16px;
    box-shadow: 0 8px 24px rgba(190, 24, 93, 0.08);
  }
  .qr-box img {
    display: block;
    width: 200px;
    height: 200px;
    border-radius: 12px;
  }

  .scan-hint {
    font-size: 13px;
    font-weight: 700;
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  .steps {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: #fdf2f8;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-align: center;
  }
  .step span {
    display: block;
    color: var(--brand);
    font-weight: 800;
    font-size: 13px;
    margin-bottom: 2px;
  }

  .footer {
    margin-top: 18px;
    font-size: 11px;
    color: #94a3b8;
    font-weight: 600;
  }

  @media print {
    body {
      background: white;
      padding: 0;
      justify-content: flex-start;
    }
    .print-bar { display: none; }
    .standee {
      box-shadow: none;
      border: 1px solid #fbcfe8;
      width: 100%;
      max-width: 440px;
      margin: 20px auto;
    }
  }
</style>
</head>
<body>

  <div class="print-bar">
    <button class="btn" onclick="window.print()">🖨️ Print Standee / Save as PDF</button>
  </div>

  <div class="standee">
    <div class="header">
      <div class="logo-badge">F</div>
      <h1>Finaaz The Beauty Salon &amp; Aesthetics</h1>
      <p>Exclusive Ladies Salon &bull; Mahim West</p>
    </div>

    <div class="body">
      <div class="callout">Rate Your Experience</div>
      <div class="stars">★★★★★</div>

      <div class="qr-box">
        <img src="finaaz_qr_code.png" alt="Scan to Review Finaaz Salon">
      </div>

      <div class="scan-hint">
        <span>📸 Point phone camera to scan</span>
      </div>

      <div class="steps">
        <div class="step">
          <span>1. Scan</span>
          Open camera
        </div>
        <div class="step">
          <span>2. Rate</span>
          Pick your stars
        </div>
        <div class="step">
          <span>3. Share</span>
          Google or WhatsApp
        </div>
      </div>

      <div class="footer">
        finaazsalonreview.vercel.app
      </div>
    </div>
  </div>

</body>
</html>
